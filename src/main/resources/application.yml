spring:
  application:
    name: hirelog
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hirelog}
    username: ${SPRING_DATASOURCE_USERNAME:hirelog}
    password: ${SPRING_DATASOURCE_PASSWORD:hirelog}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health

hirelog:
  security:
    # Single-user login. Set these via environment variables; the app refuses to start without them.
    username: ${HIRELOG_USERNAME:}
    password: ${HIRELOG_PASSWORD:}
    jwt-secret: ${HIRELOG_JWT_SECRET:}
    token-ttl: 12h
  scheduling:
    enabled: true
  follow-ups:
    # Daily at 08:00 server time: flag pending follow-ups that are due today or overdue.
    flag-cron: "0 0 8 * * *"
