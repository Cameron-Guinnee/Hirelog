services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hirelog
      POSTGRES_USER: hirelog
      POSTGRES_PASSWORD: hirelog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirelog -d hirelog"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hirelog
      SPRING_DATASOURCE_USERNAME: hirelog
      SPRING_DATASOURCE_PASSWORD: hirelog
    ports:
      - "8080:8080"

volumes:
  pgdata:
